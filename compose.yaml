services:
  postgres:
    image: postgres:18
    container_name: pe_inteligencia_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PE_DB_NAME:?Defina PE_DB_NAME no .env}
      POSTGRES_USER: ${PE_DB_USER:?Defina PE_DB_USER no .env}
      POSTGRES_PASSWORD: ${PE_DB_PASSWORD:?Defina PE_DB_PASSWORD no .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - pe_inteligencia_postgres:/var/lib/postgresql

    mem_limit: 768m
    cpus: 2.0
    shm_size: 128mb

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pe_inteligencia_postgres:
    name: pe_inteligencia_postgres
